<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>AURA-EJUST v3.0 — Expressive Vector Visor Robot Face & Full-Duplex Voice Brain</title>
  <style>
    :root {
      --bg-black: #000000;
      --ejust-red: #C0121F;
      --ras-purple: #621B6D;
      --imperial-gold: #C8A45D;
      --neon-cyan: #00e5ff;
      --neon-green: #00e676;
      --neon-amber: #ffb300;
      --blush-pink: #ff2a85;
      --text-white: #ffffff;
      --text-muted: #757480;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      color: var(--text-white);
      font-family: 'Courier New', Consolas, Monaco, monospace, sans-serif;
    }

    /* Full-Screen Pure Face Canvas Container */
    .face-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }
    #faceCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* Ultra-Minimalist Symbol-Only HUD (Top Edge) */
    .symbol-hud {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }
    .symbol-hud > * {
      pointer-events: auto;
    }
    .brand-mark {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: rgba(200, 164, 93, 0.85);
      text-transform: uppercase;
      background: rgba(12, 9, 18, 0.6);
      border: 1px solid rgba(200, 164, 93, 0.25);
      border-radius: 12px;
      padding: 4px 10px;
      backdrop-filter: blur(8px);
      font-family: monospace;
    }

    /* Minimalist Glowing Status Symbols */
    .symbol-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .symbol-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(14, 10, 22, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 13px;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .symbol-badge.active-cyan {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
      animation: pulse-symbol 2s infinite ease-in-out;
    }
    .symbol-badge.active-green {
      border-color: var(--neon-green);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.6);
    }
    .symbol-badge.active-amber {
      border-color: var(--neon-amber);
      box-shadow: 0 0 14px rgba(255, 179, 0, 0.7);
      animation: pulse-symbol 1.5s infinite ease-in-out;
    }
    .symbol-badge.dim {
      opacity: 0.35;
      border-color: rgba(255, 255, 255, 0.08);
    }

    @keyframes pulse-symbol {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    /* Subtitles Floating Dynamic Glass Capsule */
    .subtitles-pill {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 90%;
      background: rgba(8, 6, 12, 0.82);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 20px;
      padding: 7px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(14px);
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.9);
      pointer-events: auto;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 25;
      font-family: monospace;
    }
    .sub-speaker {
      font-size: 10px;
      font-weight: 800;
      color: var(--imperial-gold);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      white-space: nowrap;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      padding-right: 10px;
    }
    .sub-text {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72vw;
    }

    /* Initial Wake Tap Overlay */
    .wake-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      z-index: 50;
      cursor: pointer;
      transition: opacity 0.4s ease;
      font-family: monospace;
    }
    .wake-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .wake-ring {
      width: 82px;
      height: 82px;
      border-radius: 16px;
      border: 2px solid var(--neon-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 0 28px rgba(0, 229, 255, 0.55);
      animation: pulse-ring 2s infinite;
      margin-bottom: 16px;
      background: rgba(0, 229, 255, 0.12);
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); box-shadow: 0 0 16px rgba(0, 229, 255, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 32px rgba(0, 229, 255, 0.85); }
    }
    .wake-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .wake-desc {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.8px;
    }

    /* Optical Tracking Elements (Off-Screen continuous decoding) */
    #camVideo {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 320px;
      height: 240px;
      opacity: 0.001;
      pointer-events: none;
      z-index: -10;
    }
    .cam-pip {
      position: fixed;
      top: 50px;
      right: 14px;
      width: 104px;
      height: 78px;
      border: 1px solid rgba(0, 229, 255, 0.5);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      z-index: 35;
      display: none;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.3);
    }
    .cam-pip.visible {
      display: block;
    }
    #camOverlay {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Settings Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(14px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: #0a0712;
      border: 1.5px solid var(--ejust-red);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 45px rgba(192, 18, 31, 0.45);
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(98, 27, 109, 0.32);
    }
    .modal-title { font-size: 13px; font-weight: 800; color: var(--imperial-gold); letter-spacing: 1px; }
    .modal-close { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
    .modal-body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
    .form-input, .form-select {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 11px;
      outline: none;
    }
    .btn-save {
      background: linear-gradient(135deg, var(--ejust-red), var(--ras-purple));
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .ble-log-box {
      font-family: monospace;
      font-size: 9px;
      height: 55px;
      overflow-y: auto;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 6px;
      color: #00e676;
    }
  </style>
</head>
<body>
  <!-- Full-Bleed ASCII Symbol Cyber Face Canvas -->
  <div class="face-container" id="faceContainer">
    <canvas id="faceCanvas" onclick="onFaceTouch()"></canvas>

    <!-- Subtitles Floating Capsule -->
    <div class="subtitles-pill" id="subBox" onclick="onFaceTouch()">
      <div class="sub-speaker" id="subSpeaker">AURA-EJUST</div>
      <div class="sub-text" id="subText">Welcome to IEEE RAS at E-JUST. Speak to begin.</div>
    </div>
  </div>

  <!-- Ultra-Minimalist Symbol-Only HUD -->
  <div class="symbol-hud">
    <div class="hud-left">
      <div class="brand-mark">[ AURA-EJUST v3.0 ]</div>
    </div>
    <div class="symbol-cluster">
      <div class="symbol-badge active-cyan" id="symVoice" onclick="onFaceTouch()" title="Conversational State: Listening">🎙️</div>
      <div class="symbol-badge dim" id="symVision" onclick="toggleCamPip()" title="Optical Gaze Tracking (Tap to toggle camera view)">👁️</div>
      <div class="symbol-badge dim" id="symBle" onclick="connectBle()" title="ESP32 BLE Link">📶</div>
      <div class="symbol-badge active-green" id="symAi" onclick="openSettings()" title="AI Brain Status">🧠</div>
      <div class="symbol-badge dim" onclick="toggleFullScreen()" title="Fullscreen">⛶</div>
      <div class="symbol-badge dim" onclick="openSettings()" title="Settings">⚙️</div>
    </div>
  </div>

  <!-- Initial Wake Overlay -->
  <div class="wake-overlay" id="wakeOverlay" onclick="wakeAuraRobot()">
    <div class="wake-ring">👾</div>
    <div class="wake-title">AURA-EJUST v3.0</div>
    <div class="wake-desc">Tap screen to wake &amp; start natural hands-free conversation</div>
  </div>

  <!-- Camera Vision Elements (Continuous decoding with optional HUD toggle) -->
  <div class="cam-pip" id="camPip">
    <video id="camVideo" autoplay playsinline muted></video>
    <canvas id="camOverlay"></canvas>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">⚙️ AURA-EJUST v3.0 CONFIGURATION</div>
        <button class="modal-close" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">AI Conversational Brain</label>
          <select id="providerSelect" class="form-select" onchange="updateProviderVisibility()">
            <option value="antigravity-relay">Antigravity Local Relay Bridge (Pro Session - Free Unlimited)</option>
            <option value="openrouter">OpenRouter API (Free Llama 3.3 70B / DeepSeek)</option>
            <option value="gemini">Google Gemini API (Studio Key / Live WS)</option>
            <option value="offline-autonomous">Offline Autonomous Smart Dialog</option>
          </select>
        </div>

        <div id="antigravitySettingsGroup">
          <div class="form-group">
            <label class="form-label">Relay Bridge Address (PC Gateway)</label>
            <input type="text" id="bridgeUrlInput" class="form-input" placeholder="http://192.168.1.19:8080" />
          </div>
        </div>

        <div id="openrouterSettingsGroup" style="display: none;">
          <div class="form-group">
            <label class="form-label">OpenRouter API Key</label>
            <input type="password" id="openRouterKeyInput" class="form-input" placeholder="sk-or-v1-..." />
          </div>
          <div class="form-group">
            <label class="form-label">OpenRouter Model</label>
            <select id="openRouterModelSelect" class="form-select">
              <option value="meta-llama/llama-3.3-70b-instruct:free">meta-llama/llama-3.3-70b-instruct:free (100% Free)</option>
              <option value="deepseek/deepseek-chat">deepseek/deepseek-chat</option>
              <option value="google/gemini-2.0-flash-001">google/gemini-2.0-flash-001</option>
            </select>
          </div>
        </div>

        <div id="geminiSettingsGroup" style="display: none;">
          <div class="form-group">
            <label class="form-label">Gemini API Key</label>
            <input type="password" id="apiKeyInput" class="form-input" placeholder="AIzaSy..." />
          </div>
          <div class="form-group">
            <label class="form-label">Gemini Conversational Model</label>
            <select id="modelSelect" class="form-select">
              <option value="gemini-3.8-flash">gemini-3.8-flash (Recommended)</option>
              <option value="gemini-3.8-live">gemini-3.8-live (Live WebSocket)</option>
              <option value="offline-autonomous">Offline Smart Dialog Engine</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Natural Voice Synthesizer</label>
          <select id="voiceSelect" class="form-select">
            <option value="auto-natural">Studio Neural Audio (Edge-TTS JennyNeural / SalmaNeural)</option>
            <option value="Aoede">Aoede (Gemini Live Audio)</option>
            <option value="Puck">Puck (Gemini Live Audio)</option>
            <option value="native-tts">System Bilingual TTS Fallback</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">ESP32 BLE / Wi-Fi Monitor</label>
          <div class="ble-log-box" id="bleLogBox">BLE Ready...</div>
        </div>
      </div>
      <div style="padding: 10px 18px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: flex-end;">
        <button class="btn-save" onclick="saveSettings()">Save &amp; Apply</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       AURA-EJUST v3.0 — Expressive Vector Visor Robot Face & Full-Duplex Brain
       ========================================================================== */

    // 1. Hardware & Service Identifiers
    const NORDIC_UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NORDIC_RX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const NORDIC_TX_CHAR = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    const DEFAULT_API_KEY = 'AIzaSyDrEPiLGYrnqxzvcE9PhAP4LCx-eEAk8gk';
    let apiProvider = localStorage.getItem('AURA_API_PROVIDER') || 'antigravity-relay';
    let bridgeUrl = localStorage.getItem('AURA_BRIDGE_URL') || (window.location.origin.startsWith('http') ? window.location.origin : 'http://192.168.1.19:8080');
    let openRouterKey = localStorage.getItem('AURA_OPENROUTER_KEY') || '';
    let openRouterModel = localStorage.getItem('AURA_OPENROUTER_MODEL') || 'meta-llama/llama-3.3-70b-instruct:free';
    let apiKey = localStorage.getItem('AURA_GEMINI_KEY') || DEFAULT_API_KEY;
    let selectedModel = localStorage.getItem('AURA_GEMINI_MODEL') || 'gemini-3.8-flash';
    let selectedVoice = localStorage.getItem('AURA_VOICE') || 'auto-natural';

    // Bluetooth Objects
    let bleDevice = null;
    let bleServer = null;
    let rxChar = null;
    let txChar = null;
    let bleConnected = false;

    // Face & Emotion State
    let currentEmotion = 'ATTENTIVE'; // ATTENTIVE, HAPPY, CURIOUS, THINKING, SPEAKING, SURPRISED
    let emotionTimer = null;
    let targetGazeX = 0; // -1 to +1
    let targetGazeY = 0; // -1 to +1
    let currentGazeX = 0;
    let currentGazeY = 0;

    // Blush & Living Accents
    let blushAlpha = 0.0;
    let targetBlushAlpha = 0.0;

    // Micro-Saccades & Organic Movement
    let saccadeX = 0;
    let saccadeY = 0;
    let nextSaccadeTime = performance.now() + 2000;

    // Organic Blinking
    let blinkProgress = 0;
    let isBlinking = false;
    let nextBlinkTime = performance.now() + 2500;
    let lipSyncOpen = 0.0;

    // Full-Duplex Continuous Conversational Manager & Barge-In
    let isContinuousConversation = true;
    let isListening = false;
    let isSpeaking = false;
    let isThinking = false;
    let isAwake = false;
    let recognition = null;
    let liveWs = null;
    let isLiveWsConnected = false;
    let isLiveAudioPlaying = false;
    let audioCtx = null;
    let activeAudioSource = null;
    let activeAudioPlayer = null;
    let activeChatAbortController = null;
    let activeTtsAbortController = null;
    let currentSpeakingUtterance = '';
    let availableVoices = [];
    let speechWatchdogTimer = null;
    let restartListenTimer = null;

    // Optical Tracking State & Canvas
    let camStream = null;
    let visitorNear = false;
    let visitorDetectionCount = 0;
    let lastVisitorGreetingTime = 0;
    let procCanvas = null;
    let procCtx = null;

    // Registered VIP Database
    const VIP_DATABASE = {
      'A1:B2:C3:D4': { name: 'Prof. Amr Adly', dest: 'Main Conference Hall', markers: 1 },
      'E5:F6:07:18': { name: 'Dr. Mariam Hassan', dest: 'E-JUST Grand Theatre', markers: 2 },
      '90:A1:B2:C3': { name: 'Eng. Youssef Khaled', dest: 'Robotics Innovation Hub', markers: 1 }
    };

    let activeUid = '';
    let currentRobotState = 'IDLE';

    const ARABIC_TITLES = {
      'Prof. Amr Adly': 'أهلاً وسهلاً أ.د. عمرو عدلي — رئيس الجامعة المصرية اليابانية',
      'Dr. Mariam Hassan': 'أهلاً بكِ د. مريم حسن — المتحدث الرئيسي لـ IEEE RAS',
      'Eng. Youssef Khaled': 'مرحباً م. يوسف خالد — رئيس فرع IEEE RAS E-JUST'
    };

    /* ==========================================================================
       2. Pure ASCII / Kaomoji Character Symbol Face Engine (<, >, ^, _, -, /, *, #)
       ========================================================================== */
    const canvas = document.getElementById('faceCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
    setTimeout(resizeCanvas, 30);

    function updateSaccades(now) {
      if (now > nextSaccadeTime) {
        if (Math.random() < 0.65) {
          saccadeX = (Math.random() - 0.5) * 0.15;
          saccadeY = (Math.random() - 0.5) * 0.10;
        } else {
          saccadeX = 0;
          saccadeY = 0;
        }
        nextSaccadeTime = now + 1800 + Math.random() * 2600;
      }
    }

    // Helper Squircle Path
    function pathSquircle(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function renderFace(now) {
      const w = window.innerWidth;
      const h = window.innerHeight;

      // Pure AMOLED Obsidian Deep Black Base
      ctx.fillStyle = '#020308';
      ctx.fillRect(0, 0, w, h);

      updateSaccades(now);

      // Smooth gaze interpolation
      currentGazeX += ((targetGazeX + saccadeX) - currentGazeX) * 0.16;
      currentGazeY += ((targetGazeY + saccadeY) - currentGazeY) * 0.16;

      // Organic Blinking
      if (!isBlinking && now > nextBlinkTime) {
        isBlinking = true;
        blinkProgress = 0;
      }
      if (isBlinking) {
        blinkProgress += 0.22;
        if (blinkProgress >= 1.0) {
          isBlinking = false;
          blinkProgress = 0;
          nextBlinkTime = now + 2400 + Math.random() * 3200;
        }
      }
      const isEyeClosed = isBlinking && (blinkProgress > 0.15 && blinkProgress < 0.85);

      // Blush Alpha lerp
      targetBlushAlpha = (currentEmotion === 'HAPPY' || currentEmotion === 'IN_LOVE') ? 1.0 : 0.0;
      blushAlpha += (targetBlushAlpha - blushAlpha) * 0.12;

      // 1. Draw Sleek Robot Helmet & Visor Glass Frame (Matching Reference Images)
      drawRobotHelmet(w, h, now);

      // Visor Center & Eye Coordinates (Inside the visor glass)
      const helmetW = Math.min(w * 0.96, 1080);
      const helmetH = Math.min(h * 0.94, 660);
      const visorW = Math.min(helmetW * 0.82, 860);
      const visorH = Math.min(helmetH * 0.72, 480);
      const visorCx = w * 0.5;
      const visorCy = h * 0.5;

      const eyeSpacing = Math.min(visorW * 0.22, 185);
      const eyeW = Math.min(visorW * 0.18, 120);
      const eyeH = Math.min(visorH * 0.40, 165);
      const leftEyeX = visorCx - eyeSpacing;
      const rightEyeX = visorCx + eyeSpacing;
      const eyeY = visorCy - visorH * 0.04;

      // 2. Draw Digital Vector Visor Eyes
      drawBionicEye(leftEyeX, eyeY, eyeW, eyeH, currentGazeX, currentGazeY, isEyeClosed, 'left', now);
      drawBionicEye(rightEyeX, eyeY, eyeW, eyeH, currentGazeX, currentGazeY, isEyeClosed, 'right', now);

      // 3. Draw Blooming Cheek Blush
      if (blushAlpha > 0.01) {
        const blushR = eyeW * 0.38;
        drawCheekBlush(leftEyeX - eyeW * 0.38, eyeY + eyeH * 0.46, blushR, blushAlpha);

    // Helper: Draw Smooth Vector Heart
    function pathHeart(ctx, hx, hy, size) {
      ctx.beginPath();
      const topH = size * 0.32;
      ctx.moveTo(hx, hy + topH);
      ctx.bezierCurveTo(hx, hy - size * 0.2, hx - size * 0.55, hy - size * 0.2, hx - size * 0.55, hy + topH);
      ctx.bezierCurveTo(hx - size * 0.55, hy + size * 0.65, hx, hy + size * 0.85, hx, hy + size);
      ctx.bezierCurveTo(hx, hy + size * 0.85, hx + size * 0.55, hy + size * 0.65, hx + size * 0.55, hy + topH);
      ctx.bezierCurveTo(hx + size * 0.55, hy - size * 0.2, hx, hy - size * 0.2, hx, hy + topH);
      ctx.closePath();
    }

    /* ==========================================================================
       3. Broadcast-Grade Natural Voice & Full-Duplex Interruption Engine
       ========================================================================== */
    function stopCurrentAudio() {
      if (activeAudioSource) {
        try { activeAudioSource.stop(); activeAudioSource.disconnect(); } catch(e) {}
        activeAudioSource = null;
      }
      if (activeAudioPlayer) {
        try {
          activeAudioPlayer.pause();
          activeAudioPlayer.currentTime = 0;
        } catch(e) {}
        activeAudioPlayer = null;
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch(e) {}
      }
      if (activeChatAbortController) {
        try { activeChatAbortController.abort(); } catch(e) {}
        activeChatAbortController = null;
      }
      if (activeTtsAbortController) {
        try { activeTtsAbortController.abort(); } catch(e) {}
        activeTtsAbortController = null;
      }
      isSpeaking = false;
      isThinking = false;
      lipSyncOpen = 0.0;
      currentSpeakingUtterance = '';
      clearTimeout(speechWatchdogTimer);
    }

    // FULL-DUPLEX INTERRUPTION (BARGE-IN)
    function interruptRobot() {
      if (!isSpeaking && !isThinking) return;
      console.log('[BARGE-IN] User interrupted AURA!');
      stopCurrentAudio();
      setEmotion('CURIOUS', 2000);
      showSubtitles('AURA', 'Listening to you...');
      updateStatusSymbols();

      // Immediately arm listening to process what user is saying
      scheduleRestart(40);
    }

    async function speakReply(text, emotionAfter) {
      stopCurrentAudio();
      isSpeaking = true;
      setEmotion('SPEAKING');
      showSubtitles('AURA-EJUST', text);
      updateStatusSymbols();

      // Clean emotion tags
      const cleanedText = text.replace(/\[EMOTION:.*?\]/g, '').trim();
      currentSpeakingUtterance = cleanedText.toLowerCase();
      const isArabic = /[\u0600-\u06FF]/.test(cleanedText);
      const lang = isArabic ? 'ar' : 'en';

      let cleanBase = window.location.origin.startsWith('http') ? window.location.origin : (bridgeUrl || 'http://192.168.1.19:8080');
      cleanBase = cleanBase.replace(/\/+$/, '');
      const voiceParam = isArabic ? 'ar-EG-SalmaNeural' : 'en-US-JennyNeural';
      const ttsUrl = `${cleanBase}/api/tts?text=${encodeURIComponent(cleanedText)}&lang=${lang}&voice=${voiceParam}`;

      // Full-Duplex: Ensure microphone stays active during speech for instant barge-in!
      if (!isListening && isAwake && isContinuousConversation) {
        startListening();
      }

      activeTtsAbortController = new AbortController();

      try {
        // Fetch neural audio stream with Bypass-Tunnel-Reminder header to prevent localtunnel splash page
        const response = await fetch(ttsUrl, {
          headers: {
            'Bypass-Tunnel-Reminder': 'true'
          },
          signal: activeTtsAbortController.signal
        });

        if (!response.ok) {
          throw new Error(`TTS HTTP error ${response.status}`);
        }

        const arrayBuffer = await response.arrayBuffer();
        unlockAudioContext();

        // 1. Primary High-Fidelity Web Audio API Playback (Bypasses mobile Chrome autoplay restrictions)
        if (audioCtx) {
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioCtx.destination);
          activeAudioSource = source;

          source.onended = () => {
            if (activeAudioSource === source) {
              activeAudioSource = null;
              isSpeaking = false;
              lipSyncOpen = 0.0;
              currentSpeakingUtterance = '';
              setEmotion(emotionAfter || 'ATTENTIVE', 3000);
              updateStatusSymbols();
              if (isContinuousConversation) {
                scheduleRestart(80);
              }
            }
          };

          // Organic lip sync modulation
          const startTime = audioCtx.currentTime;
          const duration = audioBuffer.duration;
          const syncInterval = setInterval(() => {
            if (activeAudioSource === source && isSpeaking) {
              const elapsed = audioCtx.currentTime - startTime;
              lipSyncOpen = 0.35 + Math.sin(elapsed * 15) * 0.55;
            } else {
              clearInterval(syncInterval);
            }
          }, 40);

          source.start(0);

          // Watchdog to prevent hung state
          speechWatchdogTimer = setTimeout(() => {
            if (isSpeaking && activeAudioSource === source) {
              stopCurrentAudio();
              setEmotion('ATTENTIVE');
              updateStatusSymbols();
              if (isContinuousConversation) scheduleRestart(100);
            }
          }, Math.max(15000, (duration + 2) * 1000));

          return;
        }

        // 2. Secondary HTML5 Audio Element Fallback
        const audioBlob = new Blob([arrayBuffer], { type: 'audio/mpeg' });
        const blobUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio();
        audio.crossOrigin = 'anonymous';
        audio.src = blobUrl;
        activeAudioPlayer = audio;

        audio.onplay = () => {
          isSpeaking = true;
          setEmotion('SPEAKING');
          lipSyncOpen = 1.0;
          updateStatusSymbols();
          if (!isListening && isAwake && isContinuousConversation) {
            startListening();
          }
        };

        audio.ontimeupdate = () => {
          if (isSpeaking) {
            lipSyncOpen = 0.4 + Math.sin(audio.currentTime * 14) * 0.5;
          }
        };

        audio.onended = () => {
          isSpeaking = false;
          lipSyncOpen = 0.0;
          activeAudioPlayer = null;
          currentSpeakingUtterance = '';
          try { URL.revokeObjectURL(blobUrl); } catch(e) {}
          setEmotion(emotionAfter || 'ATTENTIVE', 3000);
          updateStatusSymbols();
          if (isContinuousConversation) {
            scheduleRestart(100);
          }
        };

        audio.onerror = (err) => {
          try { URL.revokeObjectURL(blobUrl); } catch(e) {}
          fallbackSystemSpeech(cleanedText, emotionAfter);
        };

        await audio.play();

      } catch (e) {
        if (e.name === 'AbortError') {
          console.log('[TTS] Playback cancelled via barge-in.');
          return;
        }
        console.warn('Neural TTS fetch notice, using fallback:', e);
        fallbackSystemSpeech(cleanedText, emotionAfter);
      }
    }

    function fallbackSystemSpeech(text, emotionAfter) {
      if (!('speechSynthesis' in window)) return;
      try { window.speechSynthesis.cancel(); } catch(e) {}

      const utterance = new SpeechSynthesisUtterance(text);
      const isArabic = /[\u0600-\u06FF]/.test(text);
      utterance.lang = isArabic ? 'ar-EG' : 'en-US';

      const best = getBestVoice(isArabic ? 'ar' : 'en');
      if (best) try { utterance.voice = best; } catch(e) {}
      utterance.rate = 0.95;
      utterance.pitch = 1.05;

      utterance.onstart = () => {
        isSpeaking = true;
        setEmotion('SPEAKING');
        lipSyncOpen = 1.0;
        updateStatusSymbols();
        // Full-Duplex: Keep listening while speaking
        if (!isListening && isAwake && isContinuousConversation) {
          startListening();
        }
      };
      utterance.onend = () => {
        isSpeaking = false;
        lipSyncOpen = 0.0;
        setEmotion(emotionAfter || 'ATTENTIVE', 3000);
        updateStatusSymbols();
        if (isContinuousConversation) scheduleRestart(120);
      };
      utterance.onerror = () => {
        isSpeaking = false;
        lipSyncOpen = 0.0;
        setEmotion('ATTENTIVE');
        updateStatusSymbols();
        if (isContinuousConversation) scheduleRestart(200);
      };

      try {
        window.speechSynthesis.speak(utterance);
      } catch(e) {
        isSpeaking = false;
        if (isContinuousConversation) scheduleRestart(150);
      }
    }

    function speakWelcome(enText, arText) {

    function populateVoices() {

    if ('speechSynthesis' in window) {

      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    function getBestVoice(langPrefix = 'en') {
      if (!availableVoices || availableVoices.length === 0) populateVoices();
      if (!availableVoices || availableVoices.length === 0) return null;
      const natural = availableVoices.find(v =>
        v.lang.toLowerCase().startsWith(langPrefix.toLowerCase()) &&
        (v.name.includes('Natural') || v.name.includes('Neural') || v.name.includes('Google') || v.name.includes('Online'))
      );
      if (natural) return natural;
      return availableVoices.find(v => v.lang.toLowerCase().startsWith(langPrefix.toLowerCase())) || null;
    }

    function wakeAuraRobot() {
      isAwake = true;
      const overlay = document.getElementById('wakeOverlay');

    function onFaceTouch() {

      }

      if (isSpeaking) {

      }
    }

    function unlockAudioContext() {
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.resume(); } catch(e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        try { audioCtx.resume(); } catch(e) {}

    /* ==========================================================================
       4. Continuous Hands-Free Full-Duplex Speech Recognition & Auto-Recovery
       ========================================================================== */
    function scheduleRestart(delay = 100) {
      clearTimeout(restartListenTimer);
      restartListenTimer = setTimeout(() => {
        if (isContinuousConversation && isAwake) {
          startListening();
        }
      }, delay);
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      if (recognition) {
        try { recognition.abort(); } catch(e) {}
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false; // continuous=false is significantly more stable on Android Chrome
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        updateStatusSymbols();
        console.log('[MIC] Full-Duplex Listening active...');
      };

      recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        const heardText = (interim || final).trim();
        if (!heardText) return;

        // Voice Barge-in interruption (Full-Duplex):
        // If robot is currently speaking or thinking, check if user is speaking
        if ((isSpeaking || isThinking) && heardText.length > 1) {
          // Acoustic Echo Filter: Ignore if microphone is hearing the robot's own speaker output
          const normHeard = heardText.toLowerCase().replace(/[^\w\s\u0600-\u06FF]/g, '');
          const normSpoken = (currentSpeakingUtterance || '').replace(/[^\w\s\u0600-\u06FF]/g, '');
          let isSelfEcho = false;

          if (isSpeaking && normSpoken.length > 3) {
            if (normSpoken.includes(normHeard) || normHeard.includes(normSpoken)) {
              isSelfEcho = true;
            } else {
              const heardWords = normHeard.split(/\s+/).filter(w => w.length > 2);
              const spokenWords = new Set(normSpoken.split(/\s+/).filter(w => w.length > 2));
              if (heardWords.length > 0) {
                let match = 0;
                for (const w of heardWords) {
                  if (spokenWords.has(w)) match++;
                }
                if (match / heardWords.length >= 0.65) isSelfEcho = true;
              }
            }
          }

          if (isSelfEcho) {
            console.log('[MIC] Suppressed robot speaker echo:', heardText);
            return;
          }

          console.log('[FULL-DUPLEX BARGE-IN] Real user speech during playback/thinking:', heardText);
          interruptRobot();
        }

        if (interim) {
          showSubtitles('YOU', interim + ' ...');
        }

        if (final.trim()) {
          showSubtitles('YOU', final.trim());
          isListening = false;
          handleUserUtterance(final.trim());
        }
      };

      recognition.onerror = (e) => {
        isListening = false;
        updateStatusSymbols();
        console.log('[SPEECH NOTICE]', e.error);
        if (e.error === 'not-allowed') {
          showSubtitles('MIC NOTICE', 'Tap screen to grant mic permission.');
        } else {
          // no-speech, aborted, network: auto-schedule clean restart
          scheduleRestart(150);
        }
      };

      recognition.onend = () => {
        isListening = false;
        updateStatusSymbols();
        if (isContinuousConversation && isAwake) {
          scheduleRestart(80);
        }
      };
    }

    function startListening() {
      // Full-Duplex: Note that isSpeaking and isThinking are intentionally omitted to keep listening continuous!
      if (isListening || !isAwake) return;
      if (!recognition) initSpeechRecognition();
      if (!recognition) return;

      try {
        recognition.start();
        isListening = true;
        updateStatusSymbols();
      } catch (e) {
        if (e.name !== 'InvalidStateError') {
          scheduleRestart(250);
        }
      }
    }

    function stopListening() {
      isListening = false;
      clearTimeout(restartListenTimer);
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      updateStatusSymbols();
    }

    function toggleContinuousMode() {
      isContinuousConversation = !isContinuousConversation;
      if (isContinuousConversation) {
        startListening();
      } else {
        stopListening();
      }
    }

    // Continuous Watchdog: Guarantees listening never permanently sleeps on Android
    setInterval(() => {
      if (isAwake && !isListening && isContinuousConversation) {
        startListening();
      }
    }, 2400);

    function showSubtitles(speaker, text) {
      const spk = document.getElementById('subSpeaker');
      const txt = document.getElementById('subText');
      if (spk && txt) {

    /* ==========================================================================
       5. Camera Vision Gaze Tracking & Elevation Mapping (normY < -0.2 / > 0.2)
       ========================================================================== */
    async function initCamera() {
      const video = document.getElementById('camVideo');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
          audio: false
        });
        video.srcObject = camStream;
        video.onloadedmetadata = () => {
          video.play();
          updateStatusSymbols();
          requestAnimationFrame(processCameraFrame);
        };
      } catch (err) {
        console.warn('Camera permission/stream notice:', err);
      }
    }

    function processCameraFrame() {
      const video = document.getElementById('camVideo');
      const overlay = document.getElementById('camOverlay');
      if (!video || video.paused || video.ended) {
        requestAnimationFrame(processCameraFrame);
        return;
      }

      if (overlay && (overlay.width !== 320 || overlay.height !== 240)) {
        overlay.width = 320;
        overlay.height = 240;
      }

      const faceBox = detectFaceByLuminance(video, 320, 240);

      if (faceBox) {
        const normX = (faceBox.cx / 320 - 0.5) * 2;
        const normY = (faceBox.cy / 240 - 0.5) * 2;

        targetGazeX = normX * 0.92;
        targetGazeY = normY * 0.92;

        // Elevation gaze mapping (Tall visitor vs Child/Seated visitor)
        if (normY < -0.2) {
          // Tall visitor elevation: raise gaze angle
          targetGazeY = Math.min(-0.25, normY * 0.95);
        } else if (normY > 0.2) {
          // Child / seated visitor elevation: lower gaze angle
          targetGazeY = Math.max(0.25, normY * 0.95);
        }

        visitorNear = true;
        updateStatusSymbols();

        // Draw reticle on mini-PiP preview if open
        if (overlay) {
          const oCtx = overlay.getContext('2d');
          oCtx.drawImage(video, 0, 0, 320, 240);
          oCtx.strokeStyle = '#00f5ff';
          oCtx.lineWidth = 2.5;
          oCtx.strokeRect(faceBox.x, faceBox.y, faceBox.w, faceBox.h);
          oCtx.fillStyle = 'rgba(0, 245, 255, 0.15)';
          oCtx.fillRect(faceBox.x, faceBox.y, faceBox.w, faceBox.h);
        }

        // Proximity greet trigger if visitor approaches
        const areaRatio = (faceBox.w * faceBox.h) / (320 * 240);
        if (areaRatio > 0.10) {
          visitorDetectionCount++;
          if (visitorDetectionCount > 14) {
            onVisitorApproached();
          }
        }
      } else {
        targetGazeX = 0;
        targetGazeY = 0;
        visitorDetectionCount = Math.max(0, visitorDetectionCount - 1);
        if (visitorDetectionCount === 0) {
          visitorNear = false;
          updateStatusSymbols();
        }
      }

      requestAnimationFrame(processCameraFrame);
    }

    let prevCamFrameData = null;
    function detectFaceByLuminance(video, w, h) {
      if (w === 0 || h === 0) return null;
      if (!procCanvas) {
        procCanvas = document.createElement('canvas');
        procCanvas.width = 80;
        procCanvas.height = 60;
        procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
      }

      procCtx.drawImage(video, 0, 0, 80, 60);
      const imgData = procCtx.getImageData(0, 0, 80, 60);
      const data = imgData.data;

      let sumX = 0, sumY = 0, count = 0;
      for (let y = 8; y < 52; y++) {
        for (let x = 12; x < 68; x++) {
          const idx = (y * 80 + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          // 1. Adaptive human skin chrominance
          const isSkin = (r > 50 && g > 30 && b > 20 && r > g && (r - g) > 8 && (r - b) > 10);
          
          // 2. Optical motion differencing (visitor moving in front of robot)
          let hasMotion = false;
          if (prevCamFrameData) {
            const diff = Math.abs(r - prevCamFrameData[idx]) + Math.abs(g - prevCamFrameData[idx + 1]) + Math.abs(b - prevCamFrameData[idx + 2]);
            if (diff > 45) hasMotion = true;
          }

          if (isSkin || hasMotion) {
            sumX += x;
            sumY += y;
            count++;
          }
        }
      }

      if (!prevCamFrameData || prevCamFrameData.length !== data.length) {
        prevCamFrameData = new Uint8Array(data.length);
      }
      prevCamFrameData.set(data);

      if (count > 40) {
        const avgX = (sumX / count) / 80 * w;
        const avgY = (sumY / count) / 60 * h;
        const boxSize = Math.max(50, Math.min(w, h) * 0.44);
        return {
          x: avgX - boxSize * 0.5,
          y: avgY - boxSize * 0.5,
          w: boxSize,
          h: boxSize,
          cx: avgX,
          cy: avgY
        };
      }
      return null;
    }

    function onVisitorApproached() {
      const now = Date.now();
      if (now - lastVisitorGreetingTime > 25000 && !isSpeaking) {
        lastVisitorGreetingTime = now;
        setEmotion('ATTENTIVE');
        speakReply("Welcome to the IEEE RAS MENA Summit at E-JUST! How may I assist you today?", 'HAPPY');
      }
    }

    /* ==========================================================================
       6. Web Bluetooth (Nordic UART Service) Implementation
       ========================================================================== */
    async function connectBle() {
      logBle('Requesting Bluetooth device (NUS)...');
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'AURA' }, { namePrefix: 'VIP' }, { namePrefix: 'ESP32' }],
          optionalServices: [NORDIC_UART_SERVICE]
        });

        bleDevice.addEventListener('gattserverdisconnected', onBleDisconnected);
        logBle('Connecting to GATT server...');

        bleServer = await bleDevice.gatt.connect();
        const service = await bleServer.getPrimaryService(NORDIC_UART_SERVICE);

        rxChar = await service.getCharacteristic(NORDIC_RX_CHAR);
        txChar = await service.getCharacteristic(NORDIC_TX_CHAR);

        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', onBleNotify);

        bleConnected = true;
        updateStatusSymbols();
        logBle('BLE Connected to ESP32!');
      } catch (err) {
        console.warn('BLE connect error:', err);
        logBle('BLE Notice: ' + err.message);
        bleConnected = false;
        updateStatusSymbols();
      }
    }

    function onBleDisconnected() {
      logBle('ESP32 BLE Disconnected.');
      bleConnected = false;
      updateStatusSymbols();
    }

    function onBleNotify(event) {
      const value = event.target.value;
      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(value).trim();
      logBle('BLE RX <-- ' + text);

      try {
        const json = JSON.parse(text);
        if (json.event === 'NFC_TAP') {
          handleNfcTap(json.uid, json.name, json.dest, json.markers);
        } else if (json.event === 'ARRIVED') {
          handleEscortArrived(json.dest);
        } else if (json.event === 'OBSTACLE') {
          setEmotion('SURPRISED', 2000);
          showSubtitles('SAFETY STOP', `Obstacle detected at ${json.dist} cm.`);
        }
      } catch (e) {
        if (text.includes('NFC_TAP')) {
          handleNfcTap('A1:B2:C3:D4', 'Prof. Amr Adly', 'Main Conference Hall', 1);
        }
      }
    }

    async function sendBleCommand(jsonObj) {
      if (!rxChar || !bleConnected) {
        logBle('BLE not connected: ' + JSON.stringify(jsonObj));
        return;
      }
      const dataStr = JSON.stringify(jsonObj) + '\n';
      const encoder = new TextEncoder();
      const bytes = encoder.encode(dataStr);

      for (let i = 0; i < bytes.length; i += 20) {
        const chunk = bytes.slice(i, i + 20);
        try {
          await rxChar.writeValueWithoutResponse(chunk);
        } catch (e) {
          try {
            await rxChar.writeValue(chunk);
          } catch (err2) {
            console.warn('BLE write error:', err2);
          }
        }
        await new Promise(r => setTimeout(r, 15));
      }
      logBle('BLE TX --> ' + dataStr.trim());
    }

    function logBle(msg) {
      console.log('[BLE]', msg);
      const box = document.getElementById('bleLogBox');
      if (box) {
        box.textContent = (box.textContent + '\n' + msg).slice(-1000);
        box.scrollTop = box.scrollHeight;
      }
    }

    /* ==========================================================================
       8. Multi-Engine AI Brain (Antigravity Relay, OpenRouter, Gemini Live, Offline)
       ========================================================================== */
    function initLiveWebSocket() {
      if (selectedModel !== 'gemini-3.8-live') {
        if (liveWs) {
          try { liveWs.close(); } catch(e) {}
          liveWs = null;
          isLiveWsConnected = false;
        }
        return;
      }

      if (liveWs && (liveWs.readyState === WebSocket.OPEN || liveWs.readyState === WebSocket.CONNECTING)) {
        return;
      }

      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      logBle('Connecting Gemini Live WebSocket...');

      try {
        liveWs = new WebSocket(wsUrl);
        liveWs.onopen = () => {
          isLiveWsConnected = true;
          updateStatusSymbols();
          const setupMsg = {
            setup: {
              model: 'models/gemini-3.8-live',
              generationConfig: {
                responseModalities: ['AUDIO'],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: {
                      voiceName: selectedVoice === 'native-tts' ? 'Aoede' : selectedVoice
                    }
                  }
                }
              },
              systemInstruction: {
                parts: [{
                  text: 'You are AURA-EJUST v3.0, the flagship autonomous VIP reception humanoid robot developed by IEEE RAS at Egypt-Japan University of Science and Technology (E-JUST). Provide concise, warm, dignified spoken answers (1-2 sentences). When thanked, include [EMOTION: HAPPY]. When asked technical questions, include [EMOTION: CURIOUS].'
                }]
              }
            }
          };
          liveWs.send(JSON.stringify(setupMsg));
        };

        liveWs.onmessage = async (evt) => {
          try {
            let data;
            if (evt.data instanceof Blob) {
              const text = await evt.data.text();
              data = JSON.parse(text);
            } else {
              data = JSON.parse(evt.data);
            }

            const sc = data.serverContent;
            if (!sc) return;

            if (sc.outputTranscription && sc.outputTranscription.text) {
              showSubtitles('AURA-EJUST (LIVE)', sc.outputTranscription.text);
            }

            if (sc.modelTurn && sc.modelTurn.parts) {
              for (const part of sc.modelTurn.parts) {
                if (part.inlineData && part.inlineData.data) {
                  playLivePcmChunk(part.inlineData.data);
                }
              }
            }
          } catch (err) {
            console.warn('Error parsing Live WS message:', err);
          }
        };

        liveWs.onerror = () => {
          updateStatusSymbols();
        };
        liveWs.onclose = () => {
          isLiveWsConnected = false;
          updateStatusSymbols();
        };
      } catch (err) {
        console.warn('WebSocket init exception:', err);
      }
    }

    let nextAudioStartTime = 0;
    function playLivePcmChunk(base64Data) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const binaryString = atob(base64Data);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        const int16 = new Int16Array(bytes.buffer);
        const float32 = new Float32Array(int16.length);
        for (let i = 0; i < int16.length; i++) {
          float32[i] = int16[i] / 32768.0;
        }

        const audioBuffer = audioCtx.createBuffer(1, float32.length, 24000);
        audioBuffer.copyToChannel(float32, 0);

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (nextAudioStartTime < now) {
          nextAudioStartTime = now;
        }
        source.start(nextAudioStartTime);
        nextAudioStartTime += audioBuffer.duration;

        setEmotion('SPEAKING');
        lipSyncOpen = 1.0;
        isLiveAudioPlaying = true;
        updateStatusSymbols();

        source.onended = () => {
          if (audioCtx.currentTime >= nextAudioStartTime - 0.05) {
            lipSyncOpen = 0.0;
            isLiveAudioPlaying = false;
            setEmotion('ATTENTIVE', 3000);
            updateStatusSymbols();
            if (isContinuousConversation) {
              scheduleRestart(200);
            }
          }
        };
      } catch (e) {
        console.warn('PCM decode/playback error:', e);
      }
    }

    function sendLiveRealtimeText(text) {
      if (liveWs && liveWs.readyState === WebSocket.OPEN) {
        liveWs.send(JSON.stringify({ realtimeInput: { text: text } }));
        return true;
      }
      return false;
    }

    function extractContextEmotion(text) {
      const lower = text.toLowerCase();
      if (lower.includes('love') || lower.includes('cute') || lower.includes('sweet') || lower.includes('beautiful') || lower.includes('بحبك') || lower.includes('جميلة') || lower.includes('حلوة')) {
        return 'IN_LOVE';
      }
      if (lower.includes('thank') || lower.includes('thanks') || lower.includes('appreciate') || lower.includes('good job') || lower.includes('awesome') || lower.includes('شكرا') || lower.includes('تسلم')) {
        return 'HAPPY';
      }
      if (lower.includes('no') || lower.includes('stop') || lower.includes('wrong') || lower.includes('لا') || lower.includes('غلط') || lower.includes('كفاية')) {
        return 'DENYING';
      }
      if (lower.includes('wink') || lower.includes('غمزة') || lower.includes('اغمزي')) {
        return 'WINK';
      }
      if (lower.includes('what') || lower.includes('how') || lower.includes('why') || lower.includes('where') || lower.includes('who') || lower.includes('can you') || lower.includes('tell me') || lower.includes('أين') || lower.includes('كيف') || lower.includes('ما هو') || lower.includes('هل')) {
        return 'CURIOUS';
      }
      if (lower.includes('wow') || lower.includes('really') || lower.includes('incredible') || lower.includes('amazing') || lower.includes('مستحيل') || lower.includes('ما شاء الله')) {
        return 'SURPRISED';
      }
      return 'ATTENTIVE';
    }

    async function handleUserUtterance(userText) {
      const lower = userText.toLowerCase().trim();
      const detectedEmotion = extractContextEmotion(userText);

      // Abort any in-flight chat request before starting new turn
      if (activeChatAbortController) {
        try { activeChatAbortController.abort(); } catch(e) {}
      }
      activeChatAbortController = new AbortController();

      // Natural Vision Interaction queries
      const isVisionQuery = (
        lower.includes('see me') ||
        lower.includes('look at me') ||
        lower.includes('can you see') ||
        lower.includes('do you see') ||
        lower.includes('what do you see') ||
        userText.includes('شايفاني') ||
        userText.includes('شيفاني') ||
        userText.includes('شايفني') ||
        userText.includes('هل تراني') ||
        userText.includes('بصي عليا')
      );

      if (isVisionQuery) {
        isThinking = false;
        const isArabic = /[\u0600-\u06FF]/.test(userText);
        const reply = isArabic ?
          "نعم، أراك بوضوح أمامي! أهلاً وسهلاً بك في قمة IEEE RAS بالجامعة المصرية اليابانية." :
          "Yes, I can see you right here! Welcome to the IEEE RAS MENA Summit at E-JUST.";
        speakReply(reply, 'HAPPY');
        return;
      }

      // Instant Interception for IEEE RAS MENA Summit "Where is the hall" Escort Command
      const isHallQuery = (
        lower.includes('where is the hall') ||
        lower.includes("where's the hall") ||
        lower.includes('where is the conference hall') ||
        lower.includes('where is the main hall') ||
        lower.includes('where the hall is') ||
        lower.includes('where is hall') ||
        lower.includes('how to get to the hall') ||
        lower.includes('how can i reach the hall') ||
        lower.includes('take me to the hall') ||
        lower.includes('lead me to the hall') ||
        userText.includes('أين القاعة') ||
        userText.includes('فين القاعة') ||
        userText.includes('قاعة المؤتمرات فين') ||
        userText.includes('قاعة المؤتمر فين') ||
        userText.includes('أين قاعة') ||
        userText.includes('فين قاعة') ||
        userText.includes('القاعة فين') ||
        userText.includes('وديني القاعة') ||
        userText.includes('وصلني للقاعة')
      );

      if (isHallQuery) {
        isThinking = false;
        const isArabic = /[\u0600-\u06FF]/.test(userText);
        const reply = isArabic ? "إنها هناك تماماً، تفضل باتباعي !!" : "It's right there, follow me !!";
        
        // Trigger BLE escort command to ESP32 line-tracking base
        sendBleCommand({
          cmd: 'START_ESCORT',
          name: 'Guest',
          dest: 'Main Conference Hall',
          markers: 1
        });
        
        currentRobotState = 'ESCORTING';
        speakReply(reply, 'HAPPY');
        return;
      }

      isThinking = true;
      setEmotion(detectedEmotion === 'HAPPY' ? 'HAPPY' : (detectedEmotion === 'IN_LOVE' ? 'IN_LOVE' : 'THINKING'));
      showSubtitles('AURA (THINKING)', '...');
      updateStatusSymbols();

      let replyText = '';

      if (apiProvider === 'antigravity-relay') {
        try {
          replyText = await callAntigravityRelayAPI(userText);
        } catch (err) {
          if (err.name === 'AbortError') {
            console.log('[CHAT] Request aborted by user barge-in.');
            isThinking = false;
            return;
          }
          console.warn('Antigravity relay failed, falling back:', err);
          replyText = generateAutonomousReply(userText);
        }
      } else if (apiProvider === 'openrouter' && openRouterKey && openRouterKey.length > 5) {
        try {
          replyText = await callOpenRouterAPI(userText);
        } catch (err) {
          console.warn('OpenRouter API call failed, falling back:', err);
          replyText = generateAutonomousReply(userText);
        }
      } else if (apiProvider === 'gemini') {
        if (selectedModel === 'gemini-3.8-live' && isLiveWsConnected && liveWs && liveWs.readyState === WebSocket.OPEN) {
          const liveSent = sendLiveRealtimeText(userText);
          if (liveSent) {
            isThinking = false;
            return;
          }
        }

        if (selectedModel !== 'offline-autonomous' && selectedModel !== 'gemini-3.8-live' && apiKey && apiKey.length > 10) {
          try {
            replyText = await callGeminiAPI(userText);
          } catch (err) {
            console.warn('Gemini API call failed, falling back:', err);
            replyText = generateAutonomousReply(userText);
          }
        } else {
          replyText = generateAutonomousReply(userText);
        }
      } else {
        replyText = generateAutonomousReply(userText);
      }

      isThinking = false;

      let finalEmotion = detectedEmotion;
      if (replyText.includes('[EMOTION: HAPPY]')) finalEmotion = 'HAPPY';
      if (replyText.includes('[EMOTION: CURIOUS]')) finalEmotion = 'CURIOUS';
      if (replyText.includes('[EMOTION: IN_LOVE]')) finalEmotion = 'IN_LOVE';
      if (replyText.includes('[EMOTION: WINK]')) finalEmotion = 'WINK';
      if (replyText.includes('[EMOTION: DENYING]')) finalEmotion = 'DENYING';

      const cleanedReply = replyText.replace(/\[EMOTION:.*?\]/g, '').trim();
      speakReply(cleanedReply, finalEmotion);
    }

    async function callAntigravityRelayAPI(promptText) {
      const systemInstruction = `You are AURA-EJUST v3.0, the warm, polite, and friendly autonomous VIP receptionist and humanoid robot developed by IEEE RAS at Egypt-Japan University of Science and Technology (E-JUST) for the IEEE RAS MENA Summit. The summit is the premier regional robotics conference at E-JUST in New Borg El-Arab City, Alexandria. When asked where the hall is or for directions to the conference hall, always respond: "It's right there, follow me !!" with [EMOTION: HAPPY]. Provide very concise, warm, natural spoken answers (1-2 sentences). When the guest thanks you, include the tag [EMOTION: HAPPY]. When asked a question, include [EMOTION: CURIOUS]. When complimented, include [EMOTION: IN_LOVE] or [EMOTION: WINK].`;

      let cleanBase = '';
      if (window.location && window.location.origin && window.location.origin.startsWith('http')) {
        cleanBase = window.location.origin;
      } else {
        cleanBase = bridgeUrl || 'http://192.168.1.19:8080';
      }
      cleanBase = cleanBase.replace(/\/+$/, '');

      const response = await fetch(`${cleanBase}/api/chat`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Bypass-Tunnel-Reminder': 'true'
        },
        body: JSON.stringify({
          prompt: promptText,
          system_instruction: systemInstruction
        }),
        signal: activeChatAbortController ? activeChatAbortController.signal : undefined
      });

      if (!response.ok) {
        throw new Error(`Relay HTTP ${response.status}`);
      }

      const json = await response.json();
      return `[EMOTION: ${json.emotion || 'ATTENTIVE'}] ${json.reply}`;
    }

    async function callOpenRouterAPI(promptText) {
      const systemInstruction = `You are AURA-EJUST v3.0, the warm, polite, and friendly autonomous VIP receptionist and humanoid robot developed by IEEE RAS at Egypt-Japan University of Science and Technology (E-JUST) for the IEEE RAS MENA Summit. The summit is the premier regional robotics conference at E-JUST in New Borg El-Arab City, Alexandria. When asked where the hall is, always respond: "It's right there, follow me !!" with [EMOTION: HAPPY]. Provide very concise, warm, natural spoken answers (1-2 sentences). When the guest thanks you, include the tag [EMOTION: HAPPY]. When asked a question, include [EMOTION: CURIOUS].`;

      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${openRouterKey}`,
          'HTTP-Referer': 'https://aura-ejust.local',
          'X-Title': 'AURA-EJUST v3.0 Humanoid'
        },
        body: JSON.stringify({
          model: openRouterModel,
          messages: [
            { role: 'system', content: systemInstruction },
            { role: 'user', content: promptText }
          ],
          temperature: 0.7,
          max_tokens: 150
        })
      });

      if (!response.ok) {
        throw new Error(`OpenRouter HTTP ${response.status}`);
      }

      const json = await response.json();
      if (json.choices && json.choices.length > 0 && json.choices[0].message) {
        return json.choices[0].message.content;
      }
      throw new Error('Empty OpenRouter response');
    }

    async function callGeminiAPI(promptText) {
      const systemInstruction = `You are AURA-EJUST v3.0, the warm and friendly autonomous VIP receptionist and humanoid robot developed by IEEE RAS at Egypt-Japan University of Science and Technology (E-JUST) for the IEEE RAS MENA Summit. When asked where the hall is, respond: "It's right there, follow me !!" with [EMOTION: HAPPY]. Keep responses very concise (1-2 sentences), natural, and warm for spoken output. If the guest thanks you, include the tag [EMOTION: HAPPY]. If they ask a technical question, include [EMOTION: CURIOUS].`;

      const targetModel = selectedModel === 'gemini-3.8-live' ? 'gemini-3.8-flash' : selectedModel;
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [
            { role: 'user', parts: [{ text: `${systemInstruction}\n\nGuest says: "${promptText}"` }] }
          ]
        })
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const json = await response.json();
      return json.candidates[0].content.parts[0].text;
    }

    function generateAutonomousReply(userText) {
      const lower = userText.toLowerCase();

      if (lower.includes('thank') || lower.includes('thanks') || lower.includes('شكرا') || lower.includes('تسلم')) {
        return '[EMOTION: HAPPY] You are most welcome! It is my absolute honor to assist you here at IEEE RAS E-JUST.';
      }
      if (lower.includes('see me') || lower.includes('can you see') || lower.includes('do you see') || userText.includes('شايفاني') || userText.includes('شيفاني') || userText.includes('شايفني')) {
        return "[EMOTION: HAPPY] Yes, I can see you right here! Welcome to the IEEE RAS MENA Summit at E-JUST.";
      }
      if ((lower.includes('where') && lower.includes('hall')) || lower.includes('where is the hall') || userText.includes('أين القاعة') || userText.includes('فين القاعة')) {
        return "[EMOTION: HAPPY] It's right there, follow me !!";
      }
      if (lower.includes('love') || lower.includes('cute') || lower.includes('sweet') || userText.includes('بحبك') || userText.includes('جميلة')) {
        return '[EMOTION: IN_LOVE] Aww, thank you! It is a true honor to welcome you to the IEEE RAS MENA Summit at E-JUST.';
      }
      if (lower.includes('no') || lower.includes('stop') || lower.includes('wrong') || userText.includes('لا') || userText.includes('غلط')) {
        return '[EMOTION: DENYING] Understood! I am readjusting to your preferences.';
      }
      if (lower.includes('wink') || userText.includes('غمزة')) {
        return '[EMOTION: WINK] Gladly! It is great to have you here at E-JUST.';
      }
      if (lower.includes('who are you') || lower.includes('your name') || lower.includes('من أنت')) {
        return '[EMOTION: ATTENTIVE] I am AURA-EJUST v3.0, the flagship autonomous VIP reception humanoid created by the IEEE Robotics and Automation Society branch at E-JUST.';
      }
      if (lower.includes('hall') || lower.includes('conference') || lower.includes('theatre') || lower.includes('قاعة')) {
        return '[EMOTION: CURIOUS] The Main Conference Hall is located along the primary floor guide path, and the Grand Theatre is at station marker two.';
      }
      if (lower.includes('mena') || lower.includes('summit') || lower.includes('قمة') || lower.includes('المؤتمر')) {
        return '[EMOTION: HAPPY] Welcome to the IEEE RAS MENA Summit at E-JUST! It is the premier robotics and automation summit across the Middle East and North Africa, hosted at E-JUST campus in New Borg El-Arab City, Alexandria.';
      }
      if (lower.includes('hello') || lower.includes('hi') || lower.includes('مرحبا') || lower.includes('أهلا')) {
        return '[EMOTION: HAPPY] Hello and welcome to E-JUST! I am ready to guide you to your session hall. Please tap your NFC badge on my chest.';
      }
      if (lower.includes('robot') || lower.includes('spec') || lower.includes('motor')) {
        return '[EMOTION: CURIOUS] I am powered by an ESP32 DevKit V1 with high-torque geared motors, 5-channel line tracking, front gaze vision, and Nordic UART BLE connectivity.';
      }
      return '[EMOTION: ATTENTIVE] Thank you for your inquiry. I am here to assist your visit and escort you to the IEEE RAS event halls at E-JUST.';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function updateProviderVisibility() {
      const prov = document.getElementById('providerSelect').value;
      const agGroup = document.getElementById('antigravitySettingsGroup');
      const orGroup = document.getElementById('openrouterSettingsGroup');
      const gemGroup = document.getElementById('geminiSettingsGroup');
      if (agGroup) agGroup.style.display = prov === 'antigravity-relay' ? 'block' : 'none';
      if (orGroup) orGroup.style.display = prov === 'openrouter' ? 'block' : 'none';
      if (gemGroup) gemGroup.style.display = prov === 'gemini' ? 'block' : 'none';
    }

    function openSettings() {
      document.getElementById('providerSelect').value = apiProvider;
      if (document.getElementById('bridgeUrlInput')) {
        document.getElementById('bridgeUrlInput').value = bridgeUrl;
      }
      document.getElementById('openRouterKeyInput').value = openRouterKey;
      document.getElementById('openRouterModelSelect').value = openRouterModel;
      document.getElementById('apiKeyInput').value = apiKey;
      document.getElementById('modelSelect').value = selectedModel;
      document.getElementById('voiceSelect').value = selectedVoice;
      updateProviderVisibility();
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function saveSettings() {
      apiProvider = document.getElementById('providerSelect').value;
      if (document.getElementById('bridgeUrlInput')) {
        bridgeUrl = document.getElementById('bridgeUrlInput').value.trim() || (window.location.origin.startsWith('http') ? window.location.origin : 'http://192.168.1.19:8080');
        localStorage.setItem('AURA_BRIDGE_URL', bridgeUrl);
      }
      openRouterKey = document.getElementById('openRouterKeyInput').value.trim();
      openRouterModel = document.getElementById('openRouterModelSelect').value;
      apiKey = document.getElementById('apiKeyInput').value.trim() || DEFAULT_API_KEY;
      selectedModel = document.getElementById('modelSelect').value;
      selectedVoice = document.getElementById('voiceSelect').value;

      localStorage.setItem('AURA_API_PROVIDER', apiProvider);
      localStorage.setItem('AURA_OPENROUTER_KEY', openRouterKey);
      localStorage.setItem('AURA_OPENROUTER_MODEL', openRouterModel);
      localStorage.setItem('AURA_GEMINI_KEY', apiKey);
      localStorage.setItem('AURA_GEMINI_MODEL', selectedModel);
      localStorage.setItem('AURA_VOICE', selectedVoice);

      if (apiProvider === 'gemini') {
        initLiveWebSocket();
      } else if (liveWs) {
        try { liveWs.close(); } catch(e) {}
        liveWs = null;
        isLiveWsConnected = false;
      }
      updateStatusSymbols();
      closeSettings();
    }

    // Startup Initialization
    window.addEventListener('DOMContentLoaded', () => {
      initSpeechRecognition();
      if (apiProvider === 'gemini') {
        initLiveWebSocket();
      }
      updateStatusSymbols();
      showSubtitles('AURA-EJUST', 'Welcome to IEEE RAS at E-JUST. Speak to begin.');

      document.addEventListener('click', unlockAudioContext, { passive: true });
      document.addEventListener('touchstart', unlockAudioContext, { passive: true });
    });
